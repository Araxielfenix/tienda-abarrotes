<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AbarrotesPOS</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1 class="logo">AbarrotesPOS</h1>
    <div class="header-actions">
      <button class="icon-btn" id="btn-clear" title="Nueva venta">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Ticket -->
    <section class="ticket-section">
      <div class="ticket-header">
        <h2>Ticket</h2>
      </div>
      
      <div class="ticket-items" id="ticket-items">
        <div class="ticket-empty" id="ticket-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"></path>
          </svg>
          <p>Escanea un producto para empezar</p>
        </div>
      </div>

      <div class="ticket-totals">
              <div class="total-row total-final">
                <span>TOTAL</span>
                <span id="total">$0.00</span>
              </div>
            </div>

      <div class="payment-section">
        <label class="input-label" for="received">Recibido</label>
        <input type="number" id="received" class="input-lg" placeholder="0.00" step="0.01" min="0">
        <div class="change-display">
          <span>Cambio</span>
          <span id="change" class="change-value">$0.00</span>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-primary btn-lg btn-block" id="btn-charge" disabled>
          Cobrar
        </button>
      </div>
    </section>
  </main>

  <!-- FAB - Scan -->
  <button class="fab-scan" id="btn-scan" aria-label="Escanear producto">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path>
      <circle cx="12" cy="13" r="4"></circle>
    </svg>
  </button>

  <!-- Camera Modal -->
  <div class="modal-overlay" id="camera-overlay"></div>
  <div class="camera-modal" id="camera-modal">
    <div class="camera-header">
      <h3>Escanear Producto</h3>
      <button class="icon-btn" id="btn-close-camera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <div class="camera-view">
      <video id="camera-video" autoplay playsinline></video>
      <div class="scan-overlay">
        <div class="scan-box"></div>
      </div>
      <div class="camera-status" id="camera-status">
        Apunta al código de barras
      </div>
    </div>
    
    <div class="camera-actions">
      <button class="btn btn-secondary" id="btn-switch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
        </svg>
        Cambiar cámara
      </button>
      <button class="btn btn-primary btn-lg" id="btn-capture">
        Capturar
      </button>
    </div>
    
    <canvas id="camera-canvas"></canvas>
  </div>

  <!-- Product Found Modal -->
  <div class="modal-overlay" id="product-overlay"></div>
  <div class="modal" id="product-modal">
    <div class="modal-content">
      <div class="product-preview" id="product-preview">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </div>
      
      <h3 class="product-title" id="product-title">Producto</h3>
      <p class="product-barcode" id="product-barcode"></p>
      
      <div class="price-input-section">
        <label class="input-label">Precio</label>
        <div class="price-input-row">
          <span class="currency">$</span>
          <input type="number" id="product-price" class="input-price" placeholder="0.00" step="0.01" min="0" autofocus>
        </div>
      </div>
      
      <div class="product-actions">
        <button class="btn btn-primary btn-block" id="btn-add-product">Agregar al ticket</button>
        <button class="btn btn-secondary btn-block" id="btn-cancel-product">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Price Search Modal -->
  <div class="modal-overlay" id="search-overlay"></div>
  <div class="modal modal-lg" id="search-modal">
    <div class="modal-header">
      <h3>Buscar precios</h3>
      <button class="icon-btn" id="btn-close-search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="search-results">
      <div class="loading">
        <div class="spinner"></div>
        <p>Buscando precios...</p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
